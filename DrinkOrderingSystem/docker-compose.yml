services:
  postgres:
    image: postgres:16-alpine
    container_name: drink-ordering-postgres
    environment:
      POSTGRES_DB: drinkordering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drink-ordering-backend
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=drinkordering;Username=postgres;Password=postgres
      Jwt__Secret: development-secret-change-me-use-environment-variable
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:5174
    ports:
      - "5000:8080"

volumes:
  postgres_data:
